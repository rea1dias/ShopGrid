server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**

        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/products/**, /api/category/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/payments/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/inventory/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notification/**

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/search/**

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:9001}
          predicates:
            - Path=/api/admin/**
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

security:
  jwt:
    secret: ${JWT_SECRET:shopgrid-development-secret-key-change-before-production-please-keep-it-long}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info