server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**

        - id: user-service-docs
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs

        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/products/**, /api/category/**

        - id: product-service-docs
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/v3/api-docs, /v3/api-docs

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**

        - id: order-service-docs
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/v3/api-docs, /v3/api-docs

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/payments/**

        - id: payment-service-docs
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs, /v3/api-docs

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/inventory/**

        - id: inventory-service-docs
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/inventory-service/v3/api-docs
          filters:
            - RewritePath=/inventory-service/v3/api-docs, /v3/api-docs

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notification/**

        - id: notification-service-docs
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - RewritePath=/notification-service/v3/api-docs, /v3/api-docs

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/search/**

        - id: search-service-docs
          uri: ${SEARCH_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/search-service/v3/api-docs
          filters:
            - RewritePath=/search-service/v3/api-docs, /v3/api-docs

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:9001}
          predicates:
            - Path=/api/admin/**

        - id: admin-service-docs
          uri: ${ADMIN_SERVICE_URL:http://localhost:9001}
          predicates:
            - Path=/admin-service/v3/api-docs
          filters:
            - RewritePath=/admin-service/v3/api-docs, /v3/api-docs

        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/cart/**

        - id: cart-service-docs
          uri: ${CART_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/cart-service/v3/api-docs
          filters:
            - RewritePath=/cart-service/v3/api-docs, /v3/api-docs
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

security:
  jwt:
    secret: ${JWT_SECRET:shopgrid-development-secret-key-change-before-production-please-keep-it-long}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs
      - name: product-service
        url: /product-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs
      - name: payment-service
        url: /payment-service/v3/api-docs
      - name: inventory-service
        url: /inventory-service/v3/api-docs
      - name: notification-service
        url: /notification-service/v3/api-docs
      - name: search-service
        url: /search-service/v3/api-docs
      - name: cart-service
        url: /cart-service/v3/api-docs
      - name: admin-service
        url: /admin-service/v3/api-docs
