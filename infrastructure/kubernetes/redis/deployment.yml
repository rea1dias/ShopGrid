apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shopgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          command: ["redis-server", "--save", "", "--appendonly", "no"]