version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: shopgrid-postgres
    environment:
      POSTGRES_USER: shopgrid
      POSTGRES_PASSWORD: shopgrid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - shopgrid-network

  redis:
    image: redis:7
    container_name: shopgrid-redis
    ports:
      - "6379:6379"
    networks:
      - shopgrid-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: shopgrid-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - shopgrid-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: shopgrid-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - shopgrid-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopgrid-kafka-ui
    depends_on:
      - kafka
    ports:
      - "1212:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - shopgrid-network

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: shopgrid-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - shopgrid-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.5
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    depends_on:
      - elasticsearch

volumes:
  postgres-data:

networks:
  shopgrid-network:
    driver: bridge
