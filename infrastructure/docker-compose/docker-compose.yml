services:

  # ─── Infrastructure ───────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: shopgrid-postgres
    environment:
      POSTGRES_USER: shopgrid
      POSTGRES_PASSWORD: shopgrid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - shopgrid-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shopgrid" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: shopgrid-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks:
      - shopgrid-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: shopgrid-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - shopgrid-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: shopgrid-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - shopgrid-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopgrid-kafka-ui
    depends_on:
      - kafka
    ports:
      - "1212:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - shopgrid-network

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: shopgrid-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - shopgrid-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.5
    container_name: shopgrid-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      - elasticsearch
    networks:
      - shopgrid-network

  #Services

  auth-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: shopgrid-auth-service
    ports:
      - "8081:8081"
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/shopgrid_auth
      AUTH_DB_USERNAME: shopgrid
      AUTH_DB_PASSWORD: shopgrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopgrid-network

  user-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: shopgrid-user-service
    ports:
      - "8082:8082"
    environment:
      USER_DB_URL: jdbc:postgresql://postgres:5432/shopgrid_user
      USER_DB_USERNAME: shopgrid
      USER_DB_PASSWORD: shopgrid
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopgrid-network

  product-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product-service
    container_name: shopgrid-product-service
    ports:
      - "8083:8083"
    environment:
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/shopgrid_product
      PRODUCT_DB_USERNAME: shopgrid
      PRODUCT_DB_PASSWORD: shopgrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopgrid-network

  order-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    container_name: shopgrid-order-service
    ports:
      - "8084:8084"
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/shopgrid_order
      ORDER_DB_USERNAME: shopgrid
      ORDER_DB_PASSWORD: shopgrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:8083
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopgrid-network

  payment-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    container_name: shopgrid-payment-service
    ports:
      - "8090:8090"
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/shopgrid_payment
      PAYMENT_DB_USERNAME: shopgrid
      PAYMENT_DB_PASSWORD: shopgrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopgrid-network

  inventory-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    container_name: shopgrid-inventory-service
    ports:
      - "8086:8086"
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/shopgrid_inventory
      INVENTORY_DB_USERNAME: shopgrid
      INVENTORY_DB_PASSWORD: shopgrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopgrid-network

  notification-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: shopgrid-notification-service
    ports:
      - "8087:8087"
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/shopgrid_notification
      NOTIFICATION_DB_USERNAME: shopgrid
      NOTIFICATION_DB_PASSWORD: shopgrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopgrid-network

  search-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: search-service
    container_name: shopgrid-search-service
    ports:
      - "8089:8089"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - shopgrid-network

  admin-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin-service
    container_name: shopgrid-admin-service
    ports:
      - "9001:9001"
    environment:
      USER_SERVICE_URL: http://user-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      - user-service
      - auth-service
    networks:
      - shopgrid-network

  api-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: shopgrid-api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8090
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      SEARCH_SERVICE_URL: http://search-service:8089
      ADMIN_SERVICE_URL: http://admin-service:9001
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - inventory-service
      - search-service
      - admin-service
    networks:
      - shopgrid-network

volumes:
  postgres-data:

networks:
  shopgrid-network:
    driver: bridge
