name: CI - Gradle Spring Boot

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
                SERVICES=(
                  "api-gateway"
                  "auth-service"
                  "user-service"
                  "product-service"
                  "order-service"
                  "payment-service"
                  "inventory-service"
                  "notification-service"
                  "search-service"
                )
                for SERVICE in "${SERVICES[@]}"; do
                  echo "Building $SERVICE..."
                  docker build \
                    --build-arg SERVICE_NAME=$SERVICE \
                    -t ${{ secrets.DOCKER_USERNAME }}/shopgrid-$SERVICE:latest \
                    -t ${{ secrets.DOCKER_USERNAME }}/shopgrid-$SERVICE:${{ github.sha }} \
                    .
                  docker push ${{ secrets.DOCKER_USERNAME }}/shopgrid-$SERVICE:latest
                  docker push ${{ secrets.DOCKER_USERNAME }}/shopgrid-$SERVICE:${{ github.sha }}
                done

